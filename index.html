<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <!-- iPad PWA完全対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>スライドサイネージ</title>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="サイネージ">

  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* iPad対策 */
      overflow: hidden;
      background: black;
    }

    #frameWrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* iPad対策 */
      background: black;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
  </style>
</head>

<body>

  <div id="loading">読み込み中...</div>

  <div id="frameWrap">
    <iframe
      id="slides"
      src="https://docs.google.com/presentation/d/1Bk9DOMByczQCkO7yO3ra_X3r8Di_Wcv2GbbowK-_3wU/embed?start=true&loop=true&delayms=10000&rm=minimal&chrome=false"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const iframe = document.getElementById("slides");
    const loading = document.getElementById("loading");

    // ロード完了
    iframe.addEventListener("load", () => {
      loading.style.opacity = "0";
      setTimeout(() => loading.style.display = "none", 500);
    });

    // 定期リロード（キャッシュ対策）
    const baseURL = iframe.src;

    setInterval(() => {
      iframe.src = baseURL + "&t=" + Date.now();
    }, 5 * 60 * 1000);

    // Service Worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
