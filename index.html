<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Slide Kiosk</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* iPadのvhバグ対策 */
      background: black;
      overflow: hidden;
    }

    #container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* 重要 */
      background: black;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <div id="container">
    <iframe
      id="slideFrame"
      src="https://docs.google.com/presentation/d/12YNJsp9qJlQyURtCHM5hOzN00lBWECPAdLQQWWBKeOo/embed?start=true&loop=true&delayms=5000&rm=minimal&chrome=false"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const baseURL =
      "https://docs.google.com/presentation/d/12YNJsp9qJlQyURtCHM5hOzN00lBWECPAdLQQWWBKeOo/embed?start=true&loop=true&delayms=5000&rm=minimal&chrome=false";

    const frame = document.getElementById("slideFrame");

    window.onload = () => {
      frame.src = baseURL + "&t=" + Date.now();
    };

    setInterval(() => {
      frame.src = baseURL + "&t=" + Date.now();
    }, 180000);
  </script>

</body>
</html>
